# Non-secret sensitive-data SHAPE patterns. NEVER put real PHI/PII values here;
# the secret wordlist lives outside any repo at $TRAPEZIA_PHI_WORDLIST.

# File path globs that must never be committed to a code repo.
path_globs = [
    "*.phi.*",
    "data/**",
    "*.age",
    "**/phi-wordlist.txt",
    "**/*secrets*.json",
]

# Generic format regexes that indicate PII/PHI content.
# The SSN shape excuses only areas 000 and 666, which SSA has never issued, so tests can use
# them as synthetic values. 9xx stays blocked: ITINs are sensitive too.
content_regexes = [
    '\b(?!000-|666-)\d{3}-\d{2}-\d{4}\b',
    '\bMRN[:#]?\s*\d{6,}\b',
    '\b\d{4}-\d{2}-\d{2}T?\b',
]

# Block-grade content regexes — specific enough to HARD-BLOCK a commit (no broad date match).
block_content_regexes = [
    '\b(?!000-|666-)\d{3}-\d{2}-\d{4}\b',
    '\bMRN[:#]?\s*\d{6,}\b',
]
